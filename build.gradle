plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'naeil'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Web
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Spring Data JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Spring Cache + Redis
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // PostgreSQL
    runtimeOnly 'org.postgresql:postgresql'

    // Flyway
    implementation 'org.flywaydb:flyway-core'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Configuration properties metadata
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // Spring Mail
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // Security context only
    implementation 'org.springframework.security:spring-security-core'

    // Apache POI (Excel 파싱)
    implementation 'org.apache.poi:poi-ooxml:5.2.5'

    // Playwright (네이버 블로그 자동화)
    implementation 'com.microsoft.playwright:playwright:1.44.0'

    // jBCrypt (네이버 커머스 API 전자서명)
    implementation 'org.mindrot:jbcrypt:0.4'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

// 기존 테스트 스위트는 비활성 상태를 유지한다 (기존 배포 파이프라인과 동일).
tasks.named('test') {
    enabled = false
}

// CFO 중앙 계산 모듈 단위 테스트 전용 태스크: ./gradlew cfoTest
tasks.register('cfoTest', Test) {
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/FinanceCalculatorTest*'
}

bootRun {
    def envFile = file('.env')
    if (envFile.exists()) {
        envFile.readLines().each { line ->
            line = line.trim()
            if (line && !line.startsWith('#') && line.contains('=')) {
                def idx = line.indexOf('=')
                def key = line.substring(0, idx).trim()
                def value = line.substring(idx + 1).trim()
                systemProperty key, value
            }
        }
    }
}

compileJava.options.encoding = 'UTF-8'
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
