# DataSource - Render env vars: DB_URL (jdbc:postgresql://...), DB_USER, DB_PASSWORD
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# SQL Initialization - run schema.sql on startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.platform=postgresql

# Server port
server.port=8080

# App configuration (override via env vars)
app.admin-key=${ADMIN_KEY:hf-event-admin-2026-secure-key}
app.cors-origins=${CORS_ORIGINS:https://highfree-event.vercel.app}

# Default rewards config
app.rewards[0].key=protein_500
app.rewards[0].label=단백깡 500P
app.rewards[0].points=500
app.rewards[0].weight=30

app.rewards[1].key=protein_300
app.rewards[1].label=단백깡 300P
app.rewards[1].points=300
app.rewards[1].weight=40

app.rewards[2].key=protein_200
app.rewards[2].label=단백깡 200P
app.rewards[2].points=200
app.rewards[2].weight=30
