# DataSource - Render env vars: DB_URL (jdbc:postgresql://...), DB_USER, DB_PASSWORD
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# SQL Initialization - run schema.sql on startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.platform=postgresql

# Server port
server.port=8080

# App configuration (override via env vars)
app.admin-key=${ADMIN_KEY:hf-event-admin-2026-secure-key}
app.cors-origins=${CORS_ORIGINS:https://highfree-event.vercel.app}

# Rewards config (weight 합계 = 10000, 0.01% 단위)
# 1000P : 80%   -> weight 8000
# 1500P : 10%   -> weight 1000
# 3000P : 8%    -> weight  800
# 5000P : 1.5%  -> weight  150
# 10000P: 0.5%  -> weight   50

app.rewards[0].key=point_1000
app.rewards[0].label=1,000P
app.rewards[0].points=1000
app.rewards[0].weight=8000

app.rewards[1].key=point_1500
app.rewards[1].label=1,500P
app.rewards[1].points=1500
app.rewards[1].weight=1000

app.rewards[2].key=point_3000
app.rewards[2].label=3,000P
app.rewards[2].points=3000
app.rewards[2].weight=800

app.rewards[3].key=point_5000
app.rewards[3].label=5,000P
app.rewards[3].points=5000
app.rewards[3].weight=150

app.rewards[4].key=point_10000
app.rewards[4].label=10,000P
app.rewards[4].points=10000
app.rewards[4].weight=50
